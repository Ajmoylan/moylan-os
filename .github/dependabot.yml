# Dependency and GitHub Actions updates (docs/SECURITY.md §10.1).
# The cooldown delays adoption of brand-new releases (a common window for hijacked packages);
# Dependabot security updates are not subject to it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Deferred major upgrades (docs/ARCHITECTURE.md §2, "Deferred major upgrades").
    # Major versions only: minor and patch releases of these packages still arrive. Dependabot
    # alerts and the CI `npm audit` gates (production and full tree) are unaffected by these rules.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-router/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
