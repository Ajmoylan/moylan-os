# Quality and security gate for every pull request and push to main (docs/SECURITY.md §10).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: Audit production dependencies (high and critical)
        run: npm run audit:prod

      - name: Audit full dependency tree, including dev tooling (high and critical)
        run: npm run audit:all

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (includes CSP hashing and output checks)
        run: npm run build

      # Browser binary only. GitHub's Ubuntu runner images preinstall Google Chrome and Chromium,
      # so Chromium's system libraries are already present; `--with-deps` additionally ran apt-get,
      # which failed when the Ubuntu mirror could not be resolved (PR #14). Playwright checks host
      # dependencies at launch and fails the e2e step with the exact missing libraries if any are.
      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: End-to-end, accessibility and security-header tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
